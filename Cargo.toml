[package]
name = "ffmpeg-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "1.0"
anyhow = "1.0"
chrono = {version="0.4.44", features=["serde"]}
serde = { version = "1.0", features = ["derive"] }
shellwords = "1.1"
[dependencies.uuid]
version = "1.23.0"
# Lets you generate random UUIDs
features = [
    "v4",
    "serde"
]
