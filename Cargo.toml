[package]
name = "ffmpeg-tui"
version = "0.1.0"
edition = "2024"

[dependencies]


# FOR TUI 
ratatui = "0.30.0"
crossterm = {version="0.29.0",features=["event-stream"]}

# ASYNC PURPOSES
tokio = { version = "1.51.1", features = ["full"] }
mio = "1.2.0"
tokio-stream = "0.1.18"
futures = "0.3.32"


# SERIALIZATION
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.2"


# ERROR
thiserror = "1.0"
anyhow = "1.0"



#LOGGIN 
tracing = "0.1.44"
tracing-subscriber = {version="0.3.23",features=["env-filter"]}





#UTILS
chrono = {version="0.4.44", features=["serde"]}
shellwords = "1.1"
regex = "1.12.3"
dirs = "6.0.0"
[dependencies.uuid]
version = "1.23.0"
# Lets you generate random UUIDs
features = [
    "v4",
    "serde"
]



[dev-dependencies]
tempfile = "3.27.0"
mockall = "0.14.0"
tokio-test = "0.4.5"


[profile.release]
lto = true 
codegen-units = 1
panic = "abort"
strip = true